<form (ngSubmit)="onSubmit()">
  <div class="form-wrapper">

    <h1>Thông tin cơ bản</h1>
    <seller-basic-info (categoryChanged)="onCategoryChanged($event)"></seller-basic-info>

    <h1>Specification</h1>
    <seller-product-specification [attributes]="specAttributes()"></seller-product-specification>

    <h1>Mô tả sản phẩm</h1>
    <seller-product-description></seller-product-description>

    <h1>Sales Information</h1>
    <seller-sales-info></seller-sales-info>

    <h1>Shipping</h1>
    <seller-shipping></seller-shipping>
    <div class="form-actions">
      <button type="submit">Lưu sản phẩm</button>
    </div>
  </div>
</form>
